<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<title>Tenders Management | Admin Panel</title>
</head>
<body data-title="Tenders Management">
<div class="admin-shell">
  <aside class="sidebar" id="kc-sidebar"></aside>
  <div class="main">
    <div class="topbar-admin" id="kc-topbar-admin"></div>
    <div class="content">

<div class="section-title-row">
  <div><h2 style="margin-bottom:2px;"><i class="fa-solid fa-file-contract" style="color:var(--acc);"></i> Tenders Management</h2><p style="color:var(--muted);font-size:.85rem;margin:0;">Add, edit, delete and search tenders management records.</p></div>
  <button class="btn btn-primary" id="modAdd"><i class="fa-solid fa-plus"></i> Add Tender</button>
</div>
<div class="toolbar">
  <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="modSearch" placeholder="Search tenders management..."></div>
  <select id="modFilter"><option>All</option><option>Open</option><option>Closed</option></select>
</div>
<div class="table-wrap">
<table class="data-table">
<thead><tr><th style="width:90px;">Actions</th><th>Tender ID</th><th>Title</th><th>Last Date</th><th>Status</th></tr></thead>
<tbody id="modBody"></tbody>
</table>
</div>

    </div>
  </div>
</div>
<div class="modal-overlay" id="kc-modal-overlay"><div class="modal" id="kc-modal"></div></div>

<script src="../frontend/js/data.js"></script>
<script src="js/admin.js"></script>
<script>

KCAdmin.crud({
  key: 'tenders', itemName: 'Tender',
  tableBodyId: 'modBody', searchId: 'modSearch', filterId: 'modFilter', addBtnId: 'modAdd',
  searchKeys: ['title','tenderId'], filterField: 'status', emptyIcon: 'fa-file-contract',
  columns: [
    { render: function(t){ return '<strong>'+t.tenderId+'</strong>'; } },
    { render: function(t){ return KCAdmin.esc(t.title); } },
    { render: function(t){ return t.lastDate; } },
    { render: function(t){ return '<span class="badge '+(t.status==='Open'?'badge-green':'badge-red')+'">'+t.status+'</span>'; } }
  ],
  fields: [
    { name:'tenderId', label:'Tender ID', required:true },
    { name:'status', label:'Status', type:'select', options:['Open','Closed'], pairWith:'tenderId' },
    { name:'title', label:'Tender Title', required:true },
    { name:'date', label:'Publish Date', type:'date', pairWith:undefined },
    { name:'lastDate', label:'Last Date of Submission', type:'date', required:true, pairWith:'date' },
    { name:'openDate', label:'Date of Opening', type:'date', pairWith:undefined },
    { name:'emd', label:'EMD Amount', pairWith:'openDate' },
    { name:'value', label:'Estimated Value' },
    { name:'content', label:'Full Details (HTML)', type:'richtext' },
    { name:'file', label:'Tender Document', type:'image' }
  ]
});

</script>
</body>
</html>
