<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<title>College Info Settings | Admin Panel</title>
</head>
<body data-title="College Info Settings">
<div class="admin-shell">
  <aside class="sidebar" id="kc-sidebar"></aside>
  <div class="main">
    <div class="topbar-admin" id="kc-topbar-admin"></div>
    <div class="content">

<div class="section-title-row"><div><h2><i class="fa-solid fa-building-columns" style="color:var(--acc);"></i> College Info Settings</h2><p style="color:var(--muted);font-size:.85rem;margin:0;">Core identity details used across the entire website.</p></div></div>
<div class="panel">
  <div class="img-preview" id="logoPrev" style="border-radius:50%;"></div>
  <input type="file" accept="image/*" id="logoFile" style="margin-bottom:14px;">
  <div class="form-row"><div class="form-group"><label>College Name</label><input id="siName"></div><div class="form-group"><label>Short Name</label><input id="siShort"></div></div>
  <div class="form-group"><label>Tagline</label><input id="siTagline"></div>
  <div class="form-group"><label>Address</label><input id="siAddress"></div>
  <div class="form-row"><div class="form-group"><label>PIN Code</label><input id="siPin"></div><div class="form-group"><label>Established Year</label><input id="siEst"></div></div>
  <div class="form-row"><div class="form-group"><label>Phone</label><input id="siPhone"></div><div class="form-group"><label>Alternate Phone</label><input id="siAltPhone"></div></div>
  <div class="form-row"><div class="form-group"><label>Email</label><input id="siEmail"></div><div class="form-group"><label>Alternate Email</label><input id="siAltEmail"></div></div>
  <div class="form-group"><label>Affiliation / Recognition</label><input id="siAffil"></div>
  <div class="form-group"><label>Office Hours</label><input id="siHours"></div>
  <div class="form-group"><label>About (short, shown in footer)</label><textarea id="siAbout" rows="3"></textarea></div>
  <h3 style="margin-top:20px;">Social Media Links</h3>
  <div class="form-row"><div class="form-group"><label>Facebook</label><input id="siFb"></div><div class="form-group"><label>Twitter / X</label><input id="siTw"></div></div>
  <div class="form-row"><div class="form-group"><label>YouTube</label><input id="siYt"></div><div class="form-group"><label>Instagram</label><input id="siIg"></div></div>
  <button class="btn btn-primary" id="siSave"><i class="fa-solid fa-floppy-disk"></i> Save College Info</button>
</div>

    </div>
  </div>
</div>
<div class="modal-overlay" id="kc-modal-overlay"><div class="modal" id="kc-modal"></div></div>

<script src="../frontend/js/data.js"></script>
<script src="js/admin.js"></script>
<script>

var s = KC.Store.get('site'); var logoData = s.logo;
document.getElementById('logoPrev').innerHTML = '<img src="'+s.logo+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
document.getElementById('logoFile').onchange = function(){ KCAdmin.fileToDataURL(this, function(data){ logoData=data; document.getElementById('logoPrev').innerHTML='<img src="'+data+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'; }); };
var map = { siName:'name', siShort:'shortName', siTagline:'tagline', siAddress:'address', siPin:'pin', siEst:'established', siPhone:'phone', siAltPhone:'altPhone', siEmail:'email', siAltEmail:'altEmail', siAffil:'affiliation', siHours:'officeHours', siAbout:'about' };
Object.keys(map).forEach(function(id){ document.getElementById(id).value = s[map[id]]; });
document.getElementById('siFb').value = s.social.facebook; document.getElementById('siTw').value = s.social.twitter;
document.getElementById('siYt').value = s.social.youtube; document.getElementById('siIg').value = s.social.instagram;
document.getElementById('siSave').onclick = function(){
  var data = Object.assign({}, s);
  Object.keys(map).forEach(function(id){ data[map[id]] = document.getElementById(id).value; });
  data.logo = logoData;
  data.social = { facebook: document.getElementById('siFb').value, twitter: document.getElementById('siTw').value, youtube: document.getElementById('siYt').value, instagram: document.getElementById('siIg').value };
  KC.Store.set('site', data);
  KCAdmin.toast('College info updated successfully.');
};

</script>
</body>
</html>
