<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<title>Downloads Management | Admin Panel</title>
</head>
<body data-title="Downloads Management">
<div class="admin-shell">
  <aside class="sidebar" id="kc-sidebar"></aside>
  <div class="main">
    <div class="topbar-admin" id="kc-topbar-admin"></div>
    <div class="content">

<div class="section-title-row">
  <div><h2 style="margin-bottom:2px;"><i class="fa-solid fa-download" style="color:var(--acc);"></i> Downloads Management</h2><p style="color:var(--muted);font-size:.85rem;margin:0;">Add, edit, delete and search downloads management records.</p></div>
  <button class="btn btn-primary" id="modAdd"><i class="fa-solid fa-plus"></i> Add Document</button>
</div>
<div class="toolbar">
  <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="modSearch" placeholder="Search downloads management..."></div>
  <select id="modFilter"><option>All</option><option>Forms</option><option>Circulars</option><option>Syllabus</option><option>Prospectus</option></select>
</div>
<div class="table-wrap">
<table class="data-table">
<thead><tr><th style="width:90px;">Actions</th><th>Title</th><th>Category</th><th>Size</th><th>Date</th></tr></thead>
<tbody id="modBody"></tbody>
</table>
</div>

    </div>
  </div>
</div>
<div class="modal-overlay" id="kc-modal-overlay"><div class="modal" id="kc-modal"></div></div>

<script src="../frontend/js/data.js"></script>
<script src="js/admin.js"></script>
<script>

KCAdmin.crud({
  key: 'downloads', itemName: 'Document',
  tableBodyId: 'modBody', searchId: 'modSearch', filterId: 'modFilter', addBtnId: 'modAdd',
  searchKeys: ['title'], filterField: 'category', emptyIcon: 'fa-download',
  columns: [
    { render: function(d){ return '<strong>'+KCAdmin.esc(d.title)+'</strong>'; } },
    { render: function(d){ return '<span class="badge badge-blue">'+d.category+'</span>'; } },
    { render: function(d){ return d.size; } },
    { render: function(d){ return d.date; } }
  ],
  fields: [
    { name:'title', label:'Document Title', required:true },
    { name:'category', label:'Category', type:'select', options:['Forms','Circulars','Syllabus','Prospectus'], pairWith:undefined },
    { name:'date', label:'Date', type:'date', pairWith:'category' },
    { name:'size', label:'File Size (e.g. 240 KB)', pairWith:undefined },
    { name:'file', label:'PDF File', type:'image', pairWith:'size' }
  ]
});

</script>
</body>
</html>
