<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<title>Messages & Enquiries | Admin Panel</title>
</head>
<body data-title="Messages & Enquiries">
<div class="admin-shell">
  <aside class="sidebar" id="kc-sidebar"></aside>
  <div class="main">
    <div class="topbar-admin" id="kc-topbar-admin"></div>
    <div class="content">

<div class="section-title-row">
  <div><h2 style="margin-bottom:2px;"><i class="fa-solid fa-envelope-open-text" style="color:var(--acc);"></i> Messages &amp; Enquiries</h2><p style="color:var(--muted);font-size:.85rem;margin:0;">Contact form and admission enquiry submissions from the website.</p></div>
</div>
<div class="panel">
  <h3>Contact Form Messages</h3>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Actions</th><th>Name</th><th>Contact</th><th>Subject</th><th>Message</th><th>Date</th></tr></thead><tbody id="msgBody"></tbody></table></div>
</div>
<div class="panel">
  <h3>Admission Enquiries</h3>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Stream</th><th>Contact</th><th>Marks</th><th>Status</th></tr></thead><tbody id="admBody"></tbody></table></div>
</div>
<div class="panel">
  <h3>Recruitment Applications (Demo)</h3>
  <div class="table-wrap"><table class="data-table"><thead><tr><th>Applicant</th><th>Job Applied</th><th>Qualification</th><th>Status</th></tr></thead><tbody id="appBody"></tbody></table></div>
</div>

    </div>
  </div>
</div>
<div class="modal-overlay" id="kc-modal-overlay"><div class="modal" id="kc-modal"></div></div>

<script src="../frontend/js/data.js"></script>
<script src="js/admin.js"></script>
<script>

function renderMsgs(){
  var msgs = KC.Store.get('messages');
  document.getElementById('msgBody').innerHTML = msgs.length ? msgs.map(function(m){
    return '<tr><td><button class="act-btn act-del" data-id="'+m.id+'"><i class="fa-solid fa-trash"></i></button></td><td>'+KCAdmin.esc(m.name)+'</td><td>'+KCAdmin.esc(m.email)+'<br><small>'+KCAdmin.esc(m.phone)+'</small></td><td>'+KCAdmin.esc(m.subject)+'</td><td style="max-width:260px;">'+KCAdmin.esc(m.message)+'</td><td>'+m.date+'</td></tr>';
  }).join('') : '<tr class="empty-row"><td colspan="6">No messages yet.</td></tr>';
  document.querySelectorAll('#msgBody .act-del').forEach(function(b){
    b.onclick = function(){ KCAdmin.confirmDelete('Delete this message?', function(){ KC.Store.remove('messages', b.dataset.id); renderMsgs(); KCAdmin.toast('Message deleted.'); }); };
  });
}
renderMsgs();
var adms = KC.Store.get('admissions');
document.getElementById('admBody').innerHTML = adms.length ? adms.map(function(a){
  return '<tr><td>'+KCAdmin.esc(a.name)+'</td><td>'+a.stream+'</td><td>'+KCAdmin.esc(a.phone)+'</td><td>'+a.marks+'</td><td><span class="badge badge-gold">'+a.status+'</span></td></tr>';
}).join('') : '<tr class="empty-row"><td colspan="5">No admission enquiries yet.</td></tr>';
var apps = KC.Store.get('applications');
document.getElementById('appBody').innerHTML = apps.map(function(a){
  var cls = a.status==='Shortlisted'?'badge-green':(a.status==='Rejected'?'badge-red':'badge-blue');
  return '<tr><td>'+KCAdmin.esc(a.name)+'</td><td>'+KCAdmin.esc(a.jobTitle)+'</td><td>'+KCAdmin.esc(a.qualification)+'</td><td><span class="badge '+cls+'">'+a.status+'</span></td></tr>';
}).join('');

</script>
</body>
</html>
