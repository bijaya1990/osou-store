<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/admin.css">
<title>Admin Login | KATAPALI +3 COLLEGE</title>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <img src="../images/logo.svg" alt="logo">
    <h2>Admin Panel Login</h2>
    <div class="sub">KATAPALI +3 COLLEGE, KATAPALI</div>
    <div class="login-err" id="loginErr">Invalid email or password. Please try again.</div>
    <form id="loginForm">
      <div class="fgroup">
        <label>Email Address</label>
        <input type="email" id="loginEmail" value="admin@katapalicollege.edu.in" required>
      </div>
      <div class="fgroup">
        <label>Password</label>
        <input type="password" id="loginPass" value="admin123" required>
      </div>
      <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard</button>
    </form>
    <div class="login-hint">
      <strong>Demo Login Credentials</strong><br>
      Email: admin@katapalicollege.edu.in<br>
      Password: admin123
    </div>
    <p style="margin-top:16px;"><a href="../frontend/index.html" style="color:var(--p);font-size:.82rem;font-weight:600;"><i class="fa-solid fa-arrow-left"></i> Back to Website</a></p>
  </div>
</div>
<script src="../frontend/js/data.js"></script>
<script src="js/admin.js"></script>
<script>
  if (sessionStorage.getItem('kc_admin_session') === '1') location.href = 'dashboard.html';
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = KCAdmin.login(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPass').value);
    if (ok) location.href = 'dashboard.html';
    else document.getElementById('loginErr').classList.add('show');
  });
</script>
</body>
</html>
