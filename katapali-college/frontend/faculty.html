<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Faculty | KATAPALI +3 COLLEGE, KATAPALI</title>
</head>
<body data-page="faculty">
<div id="kc-topbar" class="topbar"></div>
<header class="site-header" id="kc-header"></header>

<section class="page-banner">
  <div class="container">
    <h1>Faculty</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Faculty</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="section-head fade-in"><span class="eyebrow">Our Team</span><h2>Faculty List</h2><p>Meet all our dedicated teaching staff across departments</p></div>
    <div class="gallery-filters fade-in" id="fac-filters"></div>
    <div class="grid grid-4 fade-in" id="fac-list"></div>
  </div>
</section>


<footer class="site-footer" id="kc-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>

<script>
window.KCPageInit = function() {
  
  
var faculty = KC.Store.get('faculty').sort(function(a,b){return a.order-b.order;});
var depts = ['All'].concat(Array.from(new Set(faculty.map(function(f){return f.department;}))));
var filtersEl = document.getElementById('fac-filters');
filtersEl.innerHTML = depts.map(function(d,i){ return '<button class="gf-btn'+(i===0?' active':'')+'" data-d="'+d+'">'+d+'</button>'; }).join('');
function renderFac(dept){
  var list = dept==='All'? faculty : faculty.filter(function(f){return f.department===dept;});
  document.getElementById('fac-list').innerHTML = list.map(function(f){
    return '<div class="faculty-full-card"><img src="'+f.image+'" alt="'+f.name+'"><h4>'+f.name+'</h4><div class="desig">'+f.designation+'</div><div class="dept">'+f.department+' Dept. &bull; '+f.experience+'</div></div>';
  }).join('') || '<div class="empty-msg">No faculty found.</div>';
}
filtersEl.querySelectorAll('.gf-btn').forEach(function(b){
  b.onclick = function(){ filtersEl.querySelectorAll('.gf-btn').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); renderFac(b.dataset.d); };
});
renderFac('All');

};
</script>
</body>
</html>
