<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Tenders | KATAPALI +3 COLLEGE, KATAPALI</title>
</head>
<body data-page="tenders">
<div id="kc-topbar" class="topbar"></div>
<header class="site-header" id="kc-header"></header>

<section class="page-banner">
  <div class="container">
    <h1>Tenders</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Tenders</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div id="tnd-detail" style="display:none;" class="content-block fade-in"></div>
    <div id="tnd-list-wrap">
      <div class="section-head fade-in"><span class="eyebrow">Procurement</span><h2>Tenders &amp; Quotations</h2><p>Open and closed tenders published by the college</p></div>
      <div class="grid grid-2 fade-in" id="tnd-list"></div>
    </div>
  </div>
</section>


<footer class="site-footer" id="kc-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>

<script>
window.KCPageInit = function() {
  
  
var tnds = KC.Store.get('tenders');
var params = new URLSearchParams(location.search); var openId = params.get('id');
function tcard(t){
  return '<div class="card"><div class="card-body"><span class="tag '+(t.status==="Open"?"tag-green":"tag-red")+'">'+t.status+'</span>'+
  '<h4 style="margin-top:10px;">'+t.tenderId+'</h4><p>'+t.title+'</p>'+
  '<div class="card-date"><i class="fa-regular fa-calendar"></i>Last Date: '+KCU.fmtDate(t.lastDate)+'</div>'+
  '<a href="tenders.html?id='+t.id+'" class="btn btn-line btn-sm">View Details</a></div></div>';
}
document.getElementById('tnd-list').innerHTML = tnds.map(tcard).join('') || '<div class="empty-msg">No tenders currently.</div>';
function showTnd(t){
  document.getElementById('tnd-list-wrap').style.display='none';
  var d=document.getElementById('tnd-detail'); d.style.display='block';
  d.innerHTML='<a href="tenders.html" class="btn btn-line btn-sm" style="margin-bottom:18px;"><i class="fa-solid fa-arrow-left"></i> Back to Tenders</a>'+
  '<span class="tag '+(t.status==="Open"?"tag-green":"tag-red")+'">'+t.status+'</span><h2 style="margin-top:12px;">'+t.tenderId+' — '+t.title+'</h2>'+
  '<table class="kc-table"><tbody><tr><th>Published</th><td>'+KCU.fmtDate(t.date)+'</td></tr><tr><th>Last Date of Submission</th><td>'+KCU.fmtDate(t.lastDate)+'</td></tr><tr><th>Date of Opening</th><td>'+KCU.fmtDate(t.openDate)+'</td></tr><tr><th>EMD</th><td>'+t.emd+'</td></tr><tr><th>Estimated Value</th><td>'+t.value+'</td></tr></tbody></table>'+
  t.content + (t.file? '<p style="margin-top:20px;"><a href="'+t.file+'" target="_blank" class="btn btn-accent"><i class="fa-solid fa-download"></i> Download Tender Document</a></p>':'');
}
if(openId){ var f=tnds.find(function(x){return x.id===openId;}); if(f) showTnd(f); }

};
</script>
</body>
</html>
