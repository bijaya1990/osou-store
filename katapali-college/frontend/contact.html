<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Contact Us | KATAPALI +3 COLLEGE, KATAPALI</title>
</head>
<body data-page="contact">
<div id="kc-topbar" class="topbar"></div>
<header class="site-header" id="kc-header"></header>

<section class="page-banner">
  <div class="container">
    <h1>Contact Us</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Contact Us</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="content-block fade-in" id="sec-contact-intro" style="margin-bottom:30px;"></div>
    <div class="grid grid-2" style="grid-template-columns:1fr 1fr;gap:34px;align-items:start;">
      <div class="content-block fade-in">
        <h3 style="margin-top:0;">Send us a Message</h3>
        <div class="form-note" id="cf-note">Thank you for contacting us! We will get back to you shortly.</div>
        <form class="kc-form" id="contactForm">
          <div class="frow">
            <div class="fgroup"><label>Full Name *</label><input type="text" name="name" required></div>
            <div class="fgroup"><label>Phone Number *</label><input type="tel" name="phone" required></div>
          </div>
          <div class="fgroup"><label>Email Address *</label><input type="email" name="email" required></div>
          <div class="fgroup"><label>Subject *</label><input type="text" name="subject" required></div>
          <div class="fgroup"><label>Message *</label><textarea name="message" rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send Message</button>
        </form>
      </div>
      <div>
        <div class="map-info fade-in" id="kc-map-info" style="margin-bottom:20px;"></div>
        <div class="map-wrap fade-in" id="kc-map"></div>
      </div>
    </div>
  </div>
</section>


<footer class="site-footer" id="kc-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>

<script>
window.KCPageInit = function() {
  [
    ['contact-intro', '#sec-contact-intro']
  ].forEach(function(p) { KCU.injectPageContent(p[0], p[1]); });
  
var cForm = document.getElementById('contactForm');
if (cForm) cForm.addEventListener('submit', function(e){
  e.preventDefault();
  var f = new FormData(cForm);
  KC.Store.add('messages', { name:f.get('name'), email:f.get('email'), phone:f.get('phone'), subject:f.get('subject'), message:f.get('message'), date:new Date().toISOString().slice(0,10), read:false });
  document.getElementById('cf-note').classList.add('show');
  cForm.reset();
});

};
</script>
</body>
</html>
