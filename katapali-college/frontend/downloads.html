<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Downloads | KATAPALI +3 COLLEGE, KATAPALI</title>
</head>
<body data-page="downloads">
<div id="kc-topbar" class="topbar"></div>
<header class="site-header" id="kc-header"></header>

<section class="page-banner">
  <div class="container">
    <h1>Downloads</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Downloads</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="content-block fade-in" id="sec-downloads-intro" style="margin-bottom:30px;"></div>
    <div class="gallery-filters fade-in" id="dl-filters"></div>
    <div style="overflow-x:auto;"><table class="kc-table fade-in" id="dl-table">
      <thead><tr><th>Title</th><th>Category</th><th>Size</th><th>Date</th><th>Download</th></tr></thead>
      <tbody id="dl-body"></tbody>
    </table></div>
  </div>
</section>


<footer class="site-footer" id="kc-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>

<script>
window.KCPageInit = function() {
  [
    ['downloads-intro', '#sec-downloads-intro']
  ].forEach(function(p) { KCU.injectPageContent(p[0], p[1]); });
  
var dls = KC.Store.get('downloads');
var cats = ['All'].concat(Array.from(new Set(dls.map(function(d){return d.category;}))));
document.getElementById('dl-filters').innerHTML = cats.map(function(c,i){return '<button class="gf-btn'+(i===0?' active':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
function renderDl(cat){
  var list = cat==='All'? dls : dls.filter(function(d){return d.category===cat;});
  document.getElementById('dl-body').innerHTML = list.map(function(d){
    return '<tr><td>'+d.title+'</td><td><span class="tag tag-blue">'+d.category+'</span></td><td>'+d.size+'</td><td>'+KCU.fmtDate(d.date)+'</td>'+
    '<td><a href="'+d.file+'" target="_blank" class="btn btn-line btn-sm"><i class="fa-solid fa-download"></i> Download</a></td></tr>';
  }).join('') || '<tr><td colspan="5" class="empty-msg">No files found.</td></tr>';
}
document.getElementById('dl-filters').querySelectorAll('.gf-btn').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('#dl-filters .gf-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderDl(b.dataset.c);};
});
renderDl('All');

};
</script>
</body>
</html>
