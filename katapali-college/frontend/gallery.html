<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>Gallery | KATAPALI +3 COLLEGE, KATAPALI</title>
</head>
<body data-page="gallery">
<div id="kc-topbar" class="topbar"></div>
<header class="site-header" id="kc-header"></header>

<section class="page-banner">
  <div class="container">
    <h1>Gallery</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> &nbsp;/&nbsp; Gallery</div>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="section-head fade-in"><span class="eyebrow">Campus Moments</span><h2>Photo Gallery</h2><p>Browse photographs by category</p></div>
    <div class="gallery-filters fade-in" id="gal-filters"></div>
    <div class="grid grid-4 fade-in" id="gal-grid"></div>
  </div>
</section>
<section class="section section-alt" id="videos">
  <div class="container">
    <div class="section-head fade-in"><span class="eyebrow">Watch</span><h2>Video Gallery</h2><p>Campus tour and event highlight videos</p></div>
    <div class="grid grid-3 fade-in" id="video-grid"></div>
  </div>
</section>
<div class="lightbox" id="lightbox"><span class="lb-close" id="lb-close">&times;</span><div><img id="lb-img" src=""><div class="lb-cap" id="lb-cap"></div></div></div>


<footer class="site-footer" id="kc-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>

<script>
window.KCPageInit = function() {
  
  
var photos = KC.Store.get('gallery').sort(function(a,b){return a.order-b.order;});
var cats = ['All'].concat(Array.from(new Set(photos.map(function(p){return p.category;}))));
document.getElementById('gal-filters').innerHTML = cats.map(function(c,i){return '<button class="gf-btn'+(i===0?' active':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
function renderGal(cat){
  var list = cat==='All'? photos : photos.filter(function(p){return p.category===cat;});
  document.getElementById('gal-grid').innerHTML = list.map(function(p){
    return '<div class="gallery-item" data-img="'+p.image+'" data-cap="'+p.title+'"><img src="'+p.image+'" loading="lazy"><div class="gi-cap">'+p.title+'</div></div>';
  }).join('') || '<div class="empty-msg">No images in this category.</div>';
  bindLightbox();
}
document.getElementById('gal-filters').querySelectorAll('.gf-btn').forEach(function(b){
  b.onclick=function(){document.querySelectorAll('#gal-filters .gf-btn').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderGal(b.dataset.c);};
});
function bindLightbox(){
  document.querySelectorAll('.gallery-item').forEach(function(g){
    g.onclick=function(){
      document.getElementById('lb-img').src=g.dataset.img;
      document.getElementById('lb-cap').textContent=g.dataset.cap;
      document.getElementById('lightbox').classList.add('open');
    };
  });
}
document.getElementById('lb-close').onclick=function(){document.getElementById('lightbox').classList.remove('open');};
document.getElementById('lightbox').onclick=function(e){if(e.target.id==='lightbox')e.target.classList.remove('open');};
renderGal('All');
var videos = KC.Store.get('videos');
document.getElementById('video-grid').innerHTML = videos.map(function(v){
  return '<div class="video-card"><iframe src="'+v.embed+'" title="'+v.title+'" allowfullscreen></iframe><div class="vc-title">'+v.title+'</div></div>';
}).join('') || '<div class="empty-msg">No videos yet.</div>';

};
</script>
</body>
</html>
